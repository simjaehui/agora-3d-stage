<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGORA 3D STAGE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 16px;
    }
    .app-shell {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }
    .badge {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    #stage-3d {
      width: 100%;
      height: 280px;
      background: radial-gradient(circle at top, #1d4ed8 0%, #0f172a 75%);
    }
    .panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .status-box {
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.08); }
    .btn-a { background: #38bdf8; color: #0f172a; }
    .btn-b { background: #f59e0b; color: #0f172a; }
    .btn-c { background: #a855f7; color: #ffffff; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <span><strong>AGORA STAGE</strong> · 실시간 반응 테스트</span>
      <span class="badge" id="score-badge">공론 지수: 50</span>
    </div>
    <div id="stage-3d"></div>
    <div class="panel">
      <div class="status-box" id="feedback-box">
        아고라 무대가 준비되었습니다. 아래 입장을 클릭해 3D 코어와 공론 지수의 변화를 확인해 보세요.
      </div>
      <div class="btn-row">
        <button class="btn-a" onclick="triggerAction('찬성·공익 강화', 10, 0x38bdf8, 2.2)">찬성 입장 (+10)</button>
        <button class="btn-b" onclick="triggerAction('신중·절차 검증', -5, 0xf59e0b, 1.2)">신중 입장 (-5)</button>
        <button class="btn-c" onclick="triggerAction('대안·질문 제기', 15, 0xa855f7, 3.2)">질문 던지기 (+15)</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('stage-3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.z = 4.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 1.1);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(3, 4, 5);
    scene.add(dirLight);

    const geometry = new THREE.IcosahedronGeometry(1.15, 1);
    const material = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      wireframe: false,
      roughness: 0.25,
      metalness: 0.2
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    let spinSpeed = 0.01;
    let score = 50;

    window.triggerAction = function(label, delta, hexColor, speedMultiplier) {
      score += delta;
      spinSpeed = 0.01 * speedMultiplier;
      material.color.setHex(hexColor);

      const badge = document.getElementById('score-badge');
      const box = document.getElementById('feedback-box');
      badge.textContent = `공론 지수: ${score}`;
      box.style.borderLeftColor = `#${hexColor.toString(16).padStart(6, '0')}`;
      box.textContent = `[${label}] 선택 반영! 3D 무대 회전 속도와 색상이 즉시 바뀌었습니다.`;

      gsap.fromTo(mesh.scale, { x: 0.82, y: 0.82, z: 0.82 }, { x: 1.08, y: 1.08, z: 1.08, duration: 0.35, yoyo: true, repeat: 1, ease: 'back.out(2)' });
      gsap.fromTo(box, { x: -8 }, { x: 0, duration: 0.25, ease: 'power2.out' });
    };

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      mesh.rotation.x += spinSpeed * 0.6;
      mesh.rotation.y += spinSpeed;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
